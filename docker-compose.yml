services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: urban_hotspot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/urban_hotspot
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
